<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WindowWatch session</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14171b;color:#edf0f2;font:16px Inter,"Segoe UI",sans-serif}

</style><main><h1>@@WINDOW@@</h1><p>Session started <time>@@START@@</time></p>
